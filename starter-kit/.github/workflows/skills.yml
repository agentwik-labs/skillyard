name: skills
on:
  pull_request:
    paths: ["skills/**", ".claude/skills/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format check and security scan
        run: |
          npx -y https://github.com/agentwik-labs/skillyard/archive/refs/heads/main.tar.gz validate skills
          npx -y https://github.com/agentwik-labs/skillyard/archive/refs/heads/main.tar.gz scan skills
